name: Deploy production
run-name: Atlas ${{ inputs.operation }} ${{ inputs.request_id }}
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy, previous-release rollback, or selected historical restore
        required: true
        type: choice
        options: [deploy, rollback, rollback-history]
        default: deploy
      target_release:
        description: Exact monorepo SHA repeated as frontendSHA_backendSHA for rollback-history
        required: false
        type: string
      request_id:
        description: Request identifier
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: atlas-production
  cancel-in-progress: false
jobs:
  verify-frontend:
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: node --test deploy/test-workflow-pinning.mjs
      - run: npm run lint
      - run: npm run build

  verify-backend:
    if: inputs.operation == 'deploy'
    runs-on: ubuntu-24.04
    outputs:
      backend_sha: ${{ steps.revision.outputs.sha }}
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password
          MYSQL_DATABASE: web_project
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_password"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7.4
        ports: ['6379:6379']
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/web_project?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ci_only_password
      ATLAS_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/web_project?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Capture the monorepo commit under test
        id: revision
        shell: bash
        run: |
          set -euo pipefail
          test -f backend/pom.xml
          commit="$(git rev-parse HEAD)"
          [[ "$commit" =~ ^[a-f0-9]{40}$ ]]
          printf 'sha=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          echo "Verifying backend/ from monorepo commit: $commit"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Flyway migration and integration tests on a fresh database
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify

  deploy:
    needs: [verify-frontend, verify-backend]
    if: >-
      always() && github.ref == 'refs/heads/main' &&
      (inputs.operation == 'rollback' || inputs.operation == 'rollback-history' ||
       (needs.verify-frontend.result == 'success' && needs.verify-backend.result == 'success'))
    runs-on: [self-hosted, linux, x64, atlas-production]
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: atlas-console
          persist-credentials: false
      - name: Assert deployment uses the single verified monorepo commit
        if: inputs.operation == 'deploy'
        shell: bash
        env:
          VERIFIED_FRONTEND_SHA: ${{ github.sha }}
          VERIFIED_BACKEND_SHA: ${{ needs.verify-backend.outputs.backend_sha }}
        run: |
          set -euo pipefail
          [[ "$VERIFIED_FRONTEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$VERIFIED_BACKEND_SHA" =~ ^[a-f0-9]{40}$ ]]
          test "$VERIFIED_FRONTEND_SHA" = "$VERIFIED_BACKEND_SHA"
          test "$(git -C atlas-console rev-parse HEAD)" = "$VERIFIED_FRONTEND_SHA"
          test -f atlas-console/backend/pom.xml
          echo "Deploying verified monorepo commit: $VERIFIED_FRONTEND_SHA"
      - name: Apply release workflow
        env:
          RELEASE_OPERATION: ${{ inputs.operation }}
          TARGET_RELEASE: ${{ inputs.target_release }}
          VERIFIED_FRONTEND_SHA: ${{ github.sha }}
          VERIFIED_BACKEND_SHA: ${{ needs.verify-backend.outputs.backend_sha }}
        run: |
          bash atlas-console/deploy/release.sh "$RELEASE_OPERATION" "$TARGET_RELEASE"
