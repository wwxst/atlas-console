name: Backend quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci_only_password
          MYSQL_DATABASE: web_project
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pci_only_password"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      DB_URL: jdbc:mysql://127.0.0.1:3306/web_project?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      DB_USERNAME: root
      DB_PASSWORD: ci_only_password
      ATLAS_MYSQL_TEST_URL: jdbc:mysql://127.0.0.1:3306/web_project?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Flyway creates a fresh schema and integration tests pass
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify
      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
