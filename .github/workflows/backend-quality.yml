name: Backend quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas_admin
          POSTGRES_PASSWORD: ci_only_admin_password
          POSTGRES_DB: web_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas_admin -d web_project"
          --health-interval=10s --health-timeout=5s --health-retries=15
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/web_project?options=-c%20TimeZone%3DUTC
      DB_USERNAME: atlas
      DB_PASSWORD: ci_only_password
      ATLAS_POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/web_project?options=-c%20TimeZone%3DUTC
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUTH_CODE_SENDER: dev
    steps:
      - uses: actions/checkout@v4
      - name: Create least-privileged PostgreSQL application role
        env:
          PGPASSWORD: ci_only_admin_password
        run: |
          psql -h 127.0.0.1 -U atlas_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE atlas LOGIN PASSWORD 'ci_only_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          psql -h 127.0.0.1 -U atlas_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE web_project OWNER TO atlas"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Install PostgreSQL and Redis clients
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client redis-server
      - name: Run full backend quality gate
        working-directory: backend
        env:
          POSTGRES_ADMIN_USERNAME: atlas_admin
          POSTGRES_ADMIN_PASSWORD: ci_only_admin_password
        run: |
          chmod +x ./mvnw
          python3 scripts/verify_backend.py \
            --java-home "$JAVA_HOME" \
            --postgres-client "$(command -v psql)" \
            --redis-server "$(command -v redis-server)"
      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: |
            backend/target/site/jacoco/
            backend/target/quality-gate/
          if-no-files-found: ignore
