name: Backend quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: atlas_admin
          POSTGRES_PASSWORD: ci_only_admin_password
          POSTGRES_DB: web_project
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas -d web_project"
          --health-interval=10s --health-timeout=5s --health-retries=15
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=3s --health-retries=10
    env:
      DB_URL: jdbc:postgresql://127.0.0.1:5432/web_project
      DB_USERNAME: atlas
      DB_PASSWORD: ci_only_password
      ATLAS_POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/web_project
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    steps:
      - uses: actions/checkout@v4
      - name: Create least-privileged PostgreSQL application role
        env:
          PGPASSWORD: ci_only_admin_password
        run: |
          psql -h 127.0.0.1 -U atlas_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE atlas LOGIN PASSWORD 'ci_only_password' NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS"
          psql -h 127.0.0.1 -U atlas_admin -d postgres -v ON_ERROR_STOP=1 \
            -c "ALTER DATABASE web_project OWNER TO atlas"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Verify Flyway creates a fresh schema and integration tests pass
        working-directory: backend
        run: |
          chmod +x ./mvnw
          ./mvnw -B -ntp clean verify
      - name: Upload coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jacoco
          path: backend/target/site/jacoco/
          if-no-files-found: ignore
