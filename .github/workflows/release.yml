name: Publish Atlas Console release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: read

concurrency:
  group: atlas-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate semantic version and main commit
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./frontend/package.json').version")"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Require successful frontend and backend CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$GITHUB_SHA&per_page=100")"
          for workflow in "Frontend quality" "Backend quality"; do
            result="$(printf '%s' "$runs" | jq -r --arg name "$workflow" '[.workflow_runs[] | select(.name == $name and .event == "push" and .status == "completed")] | sort_by(.run_number) | last | .conclusion // empty')"
            if [[ "$result" != success ]]; then
              echo "Refusing to publish: $workflow for $GITHUB_SHA is not successful (result: ${result:-missing})."
              exit 1
            fi
          done
      - name: Install Node.js and build native frontend assets
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend release artifact
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Set up JDK 25 for native JAR artifact
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Package verified native release artifacts
        run: |
          set -euo pipefail
          chmod +x backend/mvnw
          (cd backend && ./mvnw -B -ntp -DskipTests clean package)
          mkdir -p release-assets
          tar --sort=name --mtime=@0 --owner=0 --group=0 --numeric-owner \
            -czf release-assets/atlas-frontend.tar.gz -C frontend/dist .
          cp backend/target/backend-0.0.1-SNAPSHOT.jar release-assets/atlas-backend.jar
          (cd release-assets && sha256sum atlas-frontend.tar.gz atlas-backend.jar > SHA256SUMS)
          test "$(wc -l < release-assets/SHA256SUMS)" -eq 2
      - name: Publish public GitHub Release with native deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/atlas-frontend.tar.gz \
            release-assets/atlas-backend.jar \
            release-assets/SHA256SUMS \
            --verify-tag --generate-notes --title "$GITHUB_REF_NAME" --latest
