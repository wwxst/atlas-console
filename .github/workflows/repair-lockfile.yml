name: Repair dependency lockfile (one-time)
on:
  push:
    branches: [security-ci-hardening-20261028]
    paths: ['.github/workflows/repair-lockfile.yml']

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatible advisory fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          npm audit --audit-level=high
      - name: Commit audited lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json package.json
          if ! git diff --cached --quiet; then
            git commit -m "fix(deps): resolve development dependency advisories"
            git push origin HEAD:security-ci-hardening-20261028
          fi
