name: Frontend quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: node --test deploy/test-workflow-pinning.mjs
      - run: node --test deploy/test-live-browser-input.mjs
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Installed without saving until Playwright is adopted into the lockfile.
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  deployment-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: atlas-console
      - name: Validate deploy compose without production secrets
        env:
          ATLAS_DB_PASSWORD: ci_app_test_only
          POSTGRES_ADMIN_PASSWORD: ci_admin_test_only
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          printf 'ATLAS_DB_PASSWORD=%s\\nPOSTGRES_ADMIN_PASSWORD=%s\\nJWT_SECRET=%s\\nSTORAGE_ENCRYPTION_KEY=%s\\n' "$ATLAS_DB_PASSWORD" "$POSTGRES_ADMIN_PASSWORD" "$JWT_SECRET" "$STORAGE_ENCRYPTION_KEY" > /tmp/atlas-ci.env
          docker compose --env-file /tmp/atlas-ci.env -f atlas-console/deploy/compose.yaml -f atlas-console/deploy/compose.postgres.yaml config --quiet
      - name: Build frontend image from the isolated frontend project context
        run: docker compose --env-file /tmp/atlas-ci.env -f atlas-console/deploy/compose.yaml -f atlas-console/deploy/compose.postgres.yaml build frontend
      - name: Validate external PostgreSQL Compose mode
        run: |
          cat > /tmp/atlas-external.env <<'ENV'
          ATLAS_DB_URL=jdbc:postgresql://host.docker.internal:5432/web_project
          ATLAS_DB_USERNAME=atlas
          ATLAS_DB_PASSWORD=ci_external_only
          JWT_SECRET=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          ENV
          docker compose --env-file /tmp/atlas-external.env -f atlas-console/deploy/compose.yaml config --quiet
      - name: Simulate failed deployment and previous-version rollback
        run: |
          bash -n atlas-console/install.sh
          bash -n atlas-console/deploy/release.sh
          bash -n atlas-console/deploy/test-release.sh
          bash -n atlas-console/deploy/test-installer.sh
          bash atlas-console/deploy/test-installer.sh
          bash atlas-console/deploy/test-release.sh
      - name: Verify real Compose credential parsing and installation isolation
        run: bash atlas-console/deploy/test-install-config.sh
      - name: Verify production frontend asset permissions
        run: |
          bash atlas-console/deploy/test-frontend-assets-safety.sh
          bash atlas-console/deploy/test-frontend-assets.sh
      - name: Verify real Nginx forwarded IPs and spoofing isolation
        run: |
          bash -n atlas-console/deploy/test-nginx-forwarded-ip.sh
          bash atlas-console/deploy/test-nginx-forwarded-ip.sh
