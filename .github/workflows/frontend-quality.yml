name: Frontend quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: node --test deploy/test-workflow-pinning.mjs
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  browser-e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      # Installed without saving until Playwright is adopted into the lockfile.
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npx playwright test
        working-directory: frontend
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: frontend/test-results/
          if-no-files-found: ignore

  deployment-config:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: atlas-console
      - name: Validate deploy compose without production secrets
        env:
          DB_PASSWORD: ci_test_only
          MYSQL_ROOT_PASSWORD: ci_root_test_only
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
        run: |
          printf 'DB_PASSWORD=%s\nMYSQL_ROOT_PASSWORD=%s\nJWT_SECRET=%s\nSTORAGE_ENCRYPTION_KEY=%s\n' "$DB_PASSWORD" "$MYSQL_ROOT_PASSWORD" "$JWT_SECRET" "$STORAGE_ENCRYPTION_KEY" > /tmp/atlas-ci.env
          docker compose --env-file /tmp/atlas-ci.env -f atlas-console/deploy/compose.yaml -f atlas-console/deploy/compose.mysql.yaml config --quiet
      - name: Validate external MySQL Compose mode
        run: |
          cat > /tmp/atlas-external.env <<'ENV'
          ATLAS_DB_URL=jdbc:mysql://host.docker.internal:3306/web_project?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
          ATLAS_DB_USERNAME=atlas
          ATLAS_DB_PASSWORD=ci_external_only
          DB_PASSWORD=ci_unused_password
          JWT_SECRET=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STORAGE_ENCRYPTION_KEY=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          ENV
          docker compose --env-file /tmp/atlas-external.env -f atlas-console/deploy/compose.yaml config --quiet
      - name: Simulate failed deployment and previous-version rollback
        run: |
          bash -n atlas-console/install.sh
          bash -n atlas-console/deploy/release.sh
          bash -n atlas-console/deploy/test-release.sh
          bash -n atlas-console/deploy/test-installer.sh
          bash atlas-console/deploy/test-installer.sh
          bash atlas-console/deploy/test-release.sh
      - name: Verify real Nginx forwarded IPs and spoofing isolation
        run: |
          bash -n atlas-console/deploy/test-nginx-forwarded-ip.sh
          bash atlas-console/deploy/test-nginx-forwarded-ip.sh
