name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: JDK 25 · PostgreSQL 17 · Redis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: atlas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d atlas_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Create least-privilege application database role
        env:
          PGPASSWORD: postgres
        run: |
          psql --host=127.0.0.1 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 \
            --command="CREATE ROLE atlas LOGIN PASSWORD 'atlas' NOSUPERUSER"
          psql --host=127.0.0.1 --username=postgres --dbname=postgres --set=ON_ERROR_STOP=1 \
            --command="ALTER DATABASE atlas_test OWNER TO atlas"
          psql --host=127.0.0.1 --username=postgres --dbname=atlas_test --set=ON_ERROR_STOP=1 \
            --command="ALTER SCHEMA public OWNER TO atlas"
          psql --host=127.0.0.1 --username=postgres --dbname=atlas_test --set=ON_ERROR_STOP=1 \
            --command="GRANT ALL ON SCHEMA public TO atlas"

      - name: Run Maven unit and integration tests
        working-directory: backend
        env:
          DB_URL: jdbc:postgresql://127.0.0.1:5432/atlas_test?options=-c%20TimeZone%3DUTC
          DB_USERNAME: atlas
          DB_PASSWORD: atlas
          ATLAS_POSTGRES_TEST_URL: jdbc:postgresql://127.0.0.1:5432/atlas_test?options=-c%20TimeZone%3DUTC
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          REDIS_DATABASE: "0"
          REDIS_PASSWORD: ""
          JWT_SECRET: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          STORAGE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
          AUTH_CODE_SENDER: dev
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Upload test and coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports/
            backend/target/site/jacoco/
          if-no-files-found: ignore
          retention-days: 7
