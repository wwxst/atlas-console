
server:
  port: 8080

spring:
  application:
    name: web-project

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 3MB

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/web_project?options=-c%20TimeZone%3DUTC}
    username: ${DB_USERNAME:atlas}
    password: ${DB_PASSWORD:123456}

  flyway:
    enabled: ${ATLAS_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    # Existing databases must be explicitly baselined after backup and schema verification.
    # Never enable this by default: it would silently baseline any non-empty schema.
    baseline-on-migrate: ${ATLAS_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: 1
    validate-on-migrate: true
    clean-disabled: true

  data:
    redis:
      # 本地开发默认连接本机 Redis；部署环境通过 REDIS_HOST、REDIS_PORT、REDIS_DATABASE 覆盖
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:0}
      # REDIS_PASSWORD 只填写 Redis 密码，不填写连接 URI
      password: ${REDIS_PASSWORD:}

mybatis:
  # Mapper XML 文件的位置
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    # 数据库下划线字段自动映射为 Java 驼峰属性
    map-underscore-to-camel-case: true

app:
  id-generator:
    # 多实例部署时必须为每个实例分配唯一的 datacenter-id 和 worker-id 组合。
    datacenter-id: ${ID_GENERATOR_DATACENTER_ID:0}
    worker-id: ${ID_GENERATOR_WORKER_ID:0}
  auth:
    login-protection:
      # BCrypt 同时校验上限；超出后立即返回429，不排队等待。
      max-concurrent-password-checks: 8
      # 登录 IP 和账号计数窗口；Redis 首次计数时设置 TTL。
      rate-limit-window: 60s
      # 单个 IP 在窗口内允许的登录请求数。
      max-attempts-per-ip: 60
      # 单个账号在窗口内允许的登录请求数。
      max-attempts-per-account: 20
      # Only an explicitly listed immediate reverse-proxy IP may supply X-Forwarded-For.
      # Local development trusts no proxies. Production Compose pins Nginx to 172.30.80.10.
      trusted-proxy-addresses: ${TRUSTED_PROXY_ADDRESSES:}
  storage:
    encryption-key: ${STORAGE_ENCRYPTION_KEY:}
  file:
    upload-dir: ${UPLOAD_DIR:uploads}


  deployment:
    # Never enabled until a production server, self-hosted runner and GitHub token exist.
    enabled: ${ATLAS_DEPLOYMENT_ENABLED:false}
    github-token: ${ATLAS_DEPLOYMENT_GITHUB_TOKEN:}
    state-directory: ${ATLAS_DEPLOYMENT_STATE_DIR:/var/lib/atlas/releases}

  jwt:
    # 两类 Token 的签发者；解码时必须匹配
    issuer: web-project

    # 本地开发默认值；部署环境通过 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:YXRsYXMtYmFja2VuZC1sb2NhbC1kZXYta3ktMjAyNi0wOS0wOQ==}

    # Access Token 有效期，30m 表示 30 分钟
    access-token-expiration: 30m

    # Refresh Token 有效期，30d 表示 30 天
    refresh-token-expiration: 30d
