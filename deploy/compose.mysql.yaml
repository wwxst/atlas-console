# Optional overlay for a private, Docker-managed MySQL instance.
# Use together with compose.yaml; external/Baota MySQL installs use compose.yaml only.
services:
  mysql:
    build:
      context: ../backend
      dockerfile: Dockerfile.mysql
    image: atlas-mysql:flyway
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: web_project
      MYSQL_USER: atlas
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  backend:
    environment:
      DB_URL: jdbc:mysql://mysql:3306/web_project?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      DB_USERNAME: atlas
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
