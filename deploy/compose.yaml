# Production compose stack. Execute from a GitHub Actions runner registered
# on the intended server. Never commit real .env files or publish DB/Redis ports.
name: atlas
services:
  mysql:
    build:
      context: ../../backend
      dockerfile: Dockerfile.mysql
    image: atlas-mysql:local
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: web_project
      MYSQL_USER: atlas
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ../../backend
    image: atlas-backend:${ATLAS_BACKEND_TAG:-local}
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://mysql:3306/web_project?useSSL=false&allowPublicKeyRetrieval=true
      DB_USERNAME: atlas
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Only the statically addressed Nginx container may set X-Forwarded-For.
      TRUSTED_PROXY_ADDRESSES: "172.30.80.10"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Set STORAGE_ENCRYPTION_KEY}
      # Set true only for a backed-up, schema-verified legacy DB with no Flyway history.
      ATLAS_FLYWAY_BASELINE_ON_MIGRATE: ${ATLAS_FLYWAY_BASELINE_ON_MIGRATE:-false}
      UPLOAD_DIR: /data/uploads
      ATLAS_DEPLOYMENT_ENABLED: ${ATLAS_DEPLOYMENT_ENABLED:-false}
      ATLAS_DEPLOYMENT_GITHUB_TOKEN: ${ATLAS_DEPLOYMENT_GITHUB_TOKEN:-}
    volumes:
      - uploads_data:/data/uploads
      - /opt/atlas/releases:/var/lib/atlas/releases:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test \"$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/sys-user/auth/me)\" = 401"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 12

  frontend:
    build:
      context: ..
    image: atlas-console:${ATLAS_FRONTEND_TAG:-local}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${ATLAS_HTTP_PORT:-8088}:8080"
    networks:
      default:
        ipv4_address: 172.30.80.10
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.80.0/24
          gateway: 172.30.80.1

volumes:
  mysql_data:
  redis_data:
  uploads_data:
