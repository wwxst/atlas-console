# Customer production Compose stack. Updates are executed by a private local agent;
# no GitHub Runner or customer GitHub token is required. Never publish DB/Redis ports.
name: ${ATLAS_PROJECT_NAME:-atlas}
services:
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  updater:
    build:
      context: ./updater
    image: atlas-updater:${ATLAS_BACKEND_TAG:-local}
    restart: unless-stopped
    environment:
      ATLAS_INSTALL_ROOT: ${ATLAS_INSTALL_ROOT:-/opt/atlas}
      ATLAS_ENV_FILE: ${ATLAS_INSTALL_ROOT:-/opt/atlas}/.env
      ATLAS_RELEASE_DIR: ${ATLAS_RELEASE_DIR:-/opt/atlas/releases}
      ATLAS_PROJECT_NAME: ${ATLAS_PROJECT_NAME:-atlas}
      ATLAS_DEPLOYMENT_AGENT_TOKEN: ${ATLAS_DEPLOYMENT_AGENT_TOKEN:?Set ATLAS_DEPLOYMENT_AGENT_TOKEN}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ATLAS_INSTALL_ROOT:-/opt/atlas}:${ATLAS_INSTALL_ROOT:-/opt/atlas}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s

  backend:
    build:
      context: ../backend
    image: atlas-backend:${ATLAS_BACKEND_TAG:-local}
    restart: unless-stopped
    environment:
      DB_URL: ${ATLAS_DB_URL:-jdbc:postgresql://postgres:5432/web_project?options=-c%20TimeZone%3DUTC}
      DB_USERNAME: ${ATLAS_DB_USERNAME:-atlas}
      DB_PASSWORD: ${ATLAS_DB_PASSWORD:?Set ATLAS_DB_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      # Only the statically addressed Nginx container may set X-Forwarded-For.
      TRUSTED_PROXY_ADDRESSES: "${ATLAS_NETWORK_PREFIX:-172.30.80}.10"
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY:?Set STORAGE_ENCRYPTION_KEY}
      # Set true only for a backed-up, schema-verified legacy DB with no Flyway history.
      ATLAS_FLYWAY_BASELINE_ON_MIGRATE: ${ATLAS_FLYWAY_BASELINE_ON_MIGRATE:-false}
      UPLOAD_DIR: /data/uploads
      ATLAS_DEPLOYMENT_ENABLED: ${ATLAS_DEPLOYMENT_ENABLED:-true}
      ATLAS_DEPLOYMENT_AGENT_URL: http://updater:8090
      ATLAS_DEPLOYMENT_AGENT_TOKEN: ${ATLAS_DEPLOYMENT_AGENT_TOKEN:?Set ATLAS_DEPLOYMENT_AGENT_TOKEN}
    volumes:
      - uploads_data:/data/uploads
      - ${ATLAS_RELEASE_DIR:-/opt/atlas/releases}:/var/lib/atlas/releases:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      updater:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test \"$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/sys-user/auth/me)\" = 401"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 12

  frontend:
    build:
      context: ../frontend
    image: atlas-console:${ATLAS_FRONTEND_TAG:-local}
    restart: unless-stopped
    environment:
      ATLAS_NETWORK_GATEWAY: "${ATLAS_NETWORK_PREFIX:-172.30.80}.1"
      NGINX_ENVSUBST_FILTER: "^ATLAS_"
    ports:
      - "127.0.0.1:${ATLAS_HTTP_PORT:-8088}:8080"
    networks:
      default:
        ipv4_address: "${ATLAS_NETWORK_PREFIX:-172.30.80}.10"
    depends_on:
      backend:
        condition: service_healthy

networks:
  default:
    ipam:
      config:
        - subnet: "${ATLAS_NETWORK_PREFIX:-172.30.80}.0/24"
          gateway: "${ATLAS_NETWORK_PREFIX:-172.30.80}.1"

volumes:
  redis_data:
  uploads_data:
