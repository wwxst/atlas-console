# Rendered by the official Nginx entrypoint; only ATLAS_* variables are expanded.
# Only the trusted host gateway may declare the original HTTP/HTTPS scheme.
map "$realip_remote_addr:$http_x_forwarded_proto" $atlas_forwarded_scheme {
    default $scheme;
    "${ATLAS_NETWORK_GATEWAY}:https" https;
    "${ATLAS_NETWORK_GATEWAY}:http" http;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Only the Docker bridge gateway (host TLS reverse proxy) may supply client IP.
    # The TLS edge MUST overwrite, not append, incoming X-Forwarded-For.
    set_real_ip_from ${ATLAS_NETWORK_GATEWAY};
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    # Docker service addresses can change when Compose recreates backend.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $atlas_backend backend:8080;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://$atlas_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $atlas_forwarded_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        # Overwrite arbitrary browser-provided forwarding chains with ONE vetted IP.
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location /files/ {
        proxy_pass http://$atlas_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $atlas_forwarded_scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
